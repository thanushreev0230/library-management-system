<!DOCTYPE html>
<html>
<head>
    <title>Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
    .book{
        color: white;
        margin-bottom: 30px;
        text-align: center;   
        font-size: 50px;
        /* text-decoration: underline; */
        font-weight: 800;
    }

    .main{
        display: flex;
        flex-direction: column;
        align-items: center;   /* CENTER CONTENT */
        padding-top: 60px;     /* MORE TOP SPACE */
    }

    .table-container{
        width: 90%;            /* CONTROL WIDTH */
        margin-top: 20px;
    }

    table{
        margin: auto;          /* CENTER TABLE */
    }

    td, th{
        text-align: center;
    }
</style>
</head>

<body>

<div class="sidebar">
    <h2>📚 Library</h2>
    <a href="/">🏠 Dashboard</a>
    <a href="/books">📖 Books</a>
    <a href="/add">➕ Add Book</a>
    <a href="/logout">🚪 Logout</a>
</div>

<div class="main">

<p class="book">Books List</p>

<div class="table-container">

<table>
<tr>
    <th>Title</th>
    <th>Author</th>
    <th>Status</th>
    <th>Action</th>
</tr>

{% for b in books %}
<tr>
    <td>{{ b.title }}</td>
    <td>{{ b.author }}</td>
    <td>{{ b.status }}</td>
    <td>

        {% if b.status == 'Available' %}
            <a href="/issue/{{ b.id }}" class="btn">Issue</a>
        {% else %}
            <a href="/return/{{ b.id }}" class="btn">Return</a>
        {% endif %}

        <a href="/delete/{{ b.id }}" class="btn delete-btn"
           onclick="return confirm('Delete this book?')">
           Delete
        </a>

    </td>
</tr>
{% endfor %}

</table>

</div>

</div>

</body>
</html>
