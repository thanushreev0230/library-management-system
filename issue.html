<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>📚 Library</h2>
    <a href="/">🏠 Dashboard</a>
    <a href="/books">📖 Books</a>
    <a href="/add">➕ Add Book</a>
    <a href="/logout">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <div class="glass" style="max-width:500px; margin:auto; text-align:center;">

        <h1>📖 Issue Book</h1>

        <p style="margin:15px 0;">
            <b>Book:</b> {{ book.title }}
        </p>

        <form method="POST">
            <input type="text" name="student" placeholder="👨‍🎓 Student Name" required>

            <button class="btn">📤 Issue Book</button>
        </form>

    </div>

</div>

</body>
</html>
